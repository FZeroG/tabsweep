<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle">AutoClean History</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options">
  <div class="wrap">
    <header class="masthead rise">
      <div>
        <p class="wordmark"><span>AutoClean</span><span class="redact">History</span></p>
        <h1 data-i18n="headline"></h1>
      </div>
      <div class="masthead-side">
        <label class="lang-pick">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
          <select id="lang" class="select" data-i18n-attr="aria-label:langLabel"></select>
        </label>
        <div class="stats" data-i18n-attr="aria-label:statsLabel">
          <div class="stat"><b id="statAll">0</b><span data-i18n="statAll"></span></div>
          <div class="stat visit"><b id="statVisit">0</b><span data-i18n="statVisit"></span></div>
          <div class="stat close"><b id="statClose">0</b><span data-i18n="statClose"></span></div>
        </div>
      </div>
    </header>

    <section id="welcome" class="panel welcome rise" data-i18n-attr="aria-label:welcomeTitle" hidden>
      <h2 data-i18n="welcomeTitle"></h2>
      <p data-i18n="welcomeDesc"></p>
      <ol>
        <li data-i18n="welcomeStep1"></li>
        <li data-i18n="welcomeStep2"></li>
        <li data-i18n="welcomeStep3"></li>
      </ol>
      <div class="row">
        <button id="welcomeAdd" class="btn btn-ink" type="button" data-i18n="welcomeAdd"></button>
        <button id="welcomeDone" class="btn btn-ghost" type="button" data-i18n="welcomeDone"></button>
      </div>
    </section>

    <section class="section rise">
      <h2 class="section-title"><span class="num">01</span> <span data-i18n="secAdd"></span></h2>
      <form id="addForm" class="panel add-form" novalidate>
        <div class="add-row">
          <input id="domain" class="input" spellcheck="false" autocomplete="off" aria-label="Domain" data-i18n-attr="placeholder:domainPlaceholder">
          <div id="addSeg"></div>
          <button type="submit" class="btn btn-ink" data-i18n="add"></button>
        </div>
        <label class="check-row" data-i18n-attr="title:dataTitle">
          <input id="addData" type="checkbox">
          <span data-i18n="addDataLabel"></span>
        </label>
        <label class="check-row" data-i18n-attr="title:hideTitle">
          <input id="addHidden" type="checkbox">
          <span data-i18n="addHiddenLabel"></span>
        </label>
        <div id="hint" class="hint" aria-live="polite"></div>
      </form>
    </section>

    <section class="section rise">
      <h2 class="section-title"><span class="num">02</span> <span data-i18n="secList"></span></h2>
      <div class="panel">
        <div class="privacy-bar">
          <label class="toggle-row" for="hideNames">
            <span>
              <b data-i18n="hideNamesLabel"></b>
              <small data-i18n="hideNamesDesc"></small>
            </span>
            <span id="hideNamesSlot"></span>
          </label>
          <span id="eyeSlot"></span>
        </div>
        <div id="lockRow" class="lock-row" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span id="lockStatus" class="muted"></span>
          <button id="lockSet" class="link" type="button"></button>
          <button id="lockRemove" class="link" type="button" data-i18n="lockRemove" hidden></button>
          <button id="lockForgot" class="link" type="button" data-i18n="lockForgot"></button>
        </div>
        <div id="toolbar" class="toolbar" hidden>
          <input id="filter" class="input" spellcheck="false" data-i18n-attr="placeholder:filterPlaceholder;aria-label:filterPlaceholder">
        </div>
        <ul id="list" class="list"></ul>
      </div>
    </section>

    <section class="section rise">
      <h2 class="section-title"><span class="num">03</span> <span data-i18n="secBehavior"></span></h2>
      <div class="settings-grid">
        <div class="panel setting">
          <h3 data-i18n="autoSweepTitle"></h3>
          <p data-i18n="autoSweepDesc"></p>
          <div class="row">
            <span data-i18n="every"></span>
            <select id="interval" class="select" data-i18n-attr="aria-label:intervalAria"></select>
          </div>
          <div id="intervalMsg" class="msg"></div>
        </div>
        <div class="panel setting">
          <h3 data-i18n="scheduleTitle"></h3>
          <p data-i18n="scheduleDesc"></p>
          <div class="row">
            <select id="schedule" class="select" data-i18n-attr="aria-label:scheduleAria"></select>
            <span id="scheduleNext" class="muted"></span>
          </div>
          <div id="scheduleMsg" class="msg"></div>
        </div>
        <div class="panel setting wide">
          <h3 data-i18n="notifyTitle"></h3>
          <label class="toggle-row" for="showBadge">
            <span>
              <b data-i18n="badgeLabel"></b>
              <small data-i18n="badgeDesc"></small>
            </span>
            <span id="showBadgeSlot"></span>
          </label>
          <label class="toggle-row" for="notify">
            <span>
              <b data-i18n="popupLabel"></b>
              <small data-i18n="popupDesc"></small>
            </span>
            <span id="notifySlot"></span>
          </label>
          <div class="row">
            <button id="testNotifyBtn" class="link" type="button" data-i18n="testPopup"></button>
            <span id="notifyMsg" class="msg"></span>
          </div>
        </div>
        <div class="panel setting wide">
          <h3 data-i18n="sweepNowTitle"></h3>
          <p data-i18n="sweepNowDesc"></p>
          <div id="sweepTargets"></div>
          <div class="row">
            <button id="sweepBtn" class="btn btn-ink btn-sweep" data-i18n="sweepAllBtn"></button>
          </div>
          <div id="sweepMsg" class="msg" role="status"></div>
        </div>
      </div>
    </section>

    <section class="section rise">
      <h2 class="section-title"><span class="num">04</span> <span data-i18n="secBackup"></span></h2>
      <div class="panel setting backup">
        <p data-i18n="backupDesc"></p>
        <div class="row">
          <button id="exportBtn" class="btn" type="button" data-i18n="exportBtn"></button>
          <button id="importBtn" class="btn" type="button" data-i18n="importBtn"></button>
          <input id="importFile" type="file" accept=".json,application/json" hidden>
        </div>
        <div id="backupMsg" class="msg" role="status"></div>
        <div id="importPreview" class="import-preview" role="region" data-i18n-attr="aria-label:importPreviewLabel" tabindex="-1" hidden>
          <p id="importFileInfo" class="import-file"></p>
          <fieldset class="seg import-mode" data-i18n-attr="aria-label:importModeLabel">
            <input type="radio" name="importMode" id="importMerge" value="merge" checked>
            <label for="importMerge"><span class="dot"></span><span data-i18n="importModeMerge"></span></label>
            <input type="radio" name="importMode" id="importReplace" value="replace">
            <label for="importReplace"><span class="dot"></span><span data-i18n="importModeReplace"></span></label>
          </fieldset>
          <p id="importSummary"></p>
          <div id="importAdded"></div>
          <p id="importSkipped" class="muted" hidden></p>
          <div id="importWarn" class="import-warn" hidden>
            <p id="importWarnText"></p>
            <div id="importWarnSites"></div>
          </div>
          <label id="importSettingsRow" class="check-row" hidden>
            <input id="importSettings" type="checkbox" checked>
            <span data-i18n="importWithSettings"></span>
          </label>
          <div class="row">
            <button id="importConfirm" class="btn btn-ink" type="button" data-i18n="importConfirm"></button>
            <button id="importCancel" class="btn btn-ghost" type="button" data-i18n="cancel"></button>
          </div>
        </div>
      </div>
    </section>

    <section class="section rise">
      <h2 class="section-title"><span class="num">05</span> <span data-i18n="secModes"></span></h2>
      <div class="modes">
        <div class="panel mode-card">
          <h3><span class="pill visit" data-i18n="modeVisit"></span></h3>
          <ul>
            <li data-i18n="visitLi1"></li>
            <li data-i18n="visitLi2"></li>
            <li data-i18n="visitLi3"></li>
          </ul>
        </div>
        <div class="panel mode-card close">
          <h3><span class="pill close" data-i18n="modeClose"></span></h3>
          <ul>
            <li data-i18n="closeLi1"></li>
            <li data-i18n="closeLi2"></li>
            <li data-i18n="closeLi3"></li>
          </ul>
        </div>
      </div>
    </section>

    <p class="footnote">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span data-i18n="footnote"></span>
    </p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="toastUndo" class="link" data-i18n="undo"></button>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
